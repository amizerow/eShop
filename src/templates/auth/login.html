<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body{
            background: linear-gradient(135deg, #0d6efd, #198754);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .login-container{
            width:100%;
            max-width:500px;
            background:#fff;
            border-radius:15px;
            box-shadow:0 10px 30px rgba(0,0,0,0.15);
            padding:35px;
        }

    
       .form-group{
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-bottom:7px;
            font-weight:600;
            color:#333;
        }

        input[type="text"],
        input[type="password"]{
            width:100%;
            padding:12px 15px;
            border:1px solid #ced4da;
            border-radius:8px;
            font-size:15px;
            transition:0.3s;
        }

        input:focus{
            outline:none;
            border-color:#0d6efd;
            box-shadow:0 0 0 3px rgba(13,110,253,.15);
        }
     .btn-login{
            width:100%;
            background:#0d6efd;
            color:white;
            border:none;
            padding:14px;
            font-size:16px;
            font-weight:600;
            border-radius:8px;
            cursor:pointer;
            transition:0.3s;
   
        }

        .btn-login:hover{
            background:#0b5ed7;
            transform:translateY(-2px);
        }

        .extra-links{
            text-align:center;
            margin-top:20px;
        }

        .extra-links a{
            color:#0d6efd;
            text-decoration:none;
            font-weight:600;
        }

        .extra-links a:hover{
            text-decoration:underline;
        }

        .forgot-password{
            text-align:right;
            margin-top:-10px;
            margin-bottom:20px;
        }

        .forgot-password a{
            color:#6c757d;
            text-decoration:none;
            font-size:14px;
        }

        .forgot-password a:hover{
            color:#0d6efd;
        }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo-section">
        <h1>Welcome Back</h1>
        <p>Sign in to your account</p>
    </div>

    <form action="/auth/login" method="POST">

        <div class="form-group">
            <label for="user_name">Username</label>
            <input
                name="user_name"
                id="user_name"
                type="text"
                placeholder="Enter your username"
                required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                name="password"
                id="password"
                type="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required>
        </div>

        <div class="forgot-password">
            <a href="/auth/forgot-password">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-login">
            Login
        </button>

        <div class="extra-links">
            Don't have an account?
            <a href="/auth/signup">Create Account</a>
        </div>

    </form>

</div>

</body>
</html>
